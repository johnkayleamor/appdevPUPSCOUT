<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PUPSCOUT - Log In</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      background-color: #FAF6F0;
    }

    /* Left Panel - Maroon Branding */
    .left-panel {
      flex: 1;
      background-color: #7A0000;
      color: #FFFFFF;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 40px 24px;
      text-align: center;
    }

    .brand-center {
      margin: auto 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .pup-logo {
      width: 210px;
      height: 210px;
      object-fit: cover;
      border-radius: 50%;
      margin-bottom: 24px;
    }

    .brand-title {
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 10px;
    }

    .brand-subtitle {
      font-size: 0.95rem;
      color: #F3E8E8;
      font-weight: 400;
    }

    .campus-footer {
      font-size: 0.75rem;
      color: #E0D0D0;
    }

    /* Right Panel - Login Card */
    .right-panel {
      flex: 1;
      background-color: #FAF6F0;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .login-card {
      background-color: #FFFFFF;
      width: 100%;
      max-width: 420px;
      padding: 32px 28px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
    }

    /* Pill Toggle Tabs */
    .auth-tabs {
      display: flex;
      background-color: #F2ECE4;
      border-radius: 999px;
      padding: 4px;
      margin-bottom: 24px;
    }

    .auth-tab {
      flex: 1;
      text-align: center;
      padding: 10px 0;
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: 999px;
      text-decoration: none;
      color: #555555;
      transition: 0.2s;
    }

    .auth-tab.active {
      background-color: #7A0000;
      color: #FFFFFF;
    }

    .card-heading {
      font-size: 1.5rem;
      font-weight: 700;
      color: #1E1E1E;
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: #333333;
      margin-bottom: 6px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .form-control {
      width: 100%;
      padding: 11px 14px;
      font-size: 0.85rem;
      border: 1px solid #DCDCDC;
      border-radius: 8px;
      outline: none;
      color: #222222;
      background-color: #FFFFFF;
    }

    .form-control:focus {
      border-color: #7A0000;
    }

    .toggle-password {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      cursor: pointer;
      color: #666666;
      display: flex;
      align-items: center;
      padding: 0;
    }

    /* Custom Role Dropdown matching Figma UI */
    .custom-select-wrapper {
      position: relative;
      width: 100%;
    }

    .custom-select-trigger {
      width: 100%;
      padding: 11px 14px;
      font-size: 0.85rem;
      border: 1px solid #DCDCDC;
      border-radius: 8px;
      background-color: #FFFFFF;
      color: #757575;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      user-select: none;
    }

    .custom-select-trigger.has-value {
      color: #222222;
    }

    .custom-select-wrapper.open .custom-select-trigger {
      border-color: #7A0000;
    }

    .chevron-icon {
      transition: transform 0.2s ease;
    }

    .custom-select-wrapper.open .chevron-icon {
      transform: rotate(180deg);
    }

    .custom-options {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      right: 0;
      background-color: #FFFFFF;
      border: 1px solid #E5E5E5;
      border-radius: 10px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
      z-index: 99;
      display: none;
      overflow: hidden;
      padding: 6px 0;
    }

    .custom-select-wrapper.open .custom-options {
      display: block;
    }

    .custom-option {
      padding: 10px 16px;
      font-size: 0.85rem;
      color: #222222;
      cursor: pointer;
      transition: background-color 0.15s;
    }

    .custom-option:hover,
    .custom-option.selected {
      background-color: #FAF6F0;
      color: #7A0000;
      font-weight: 500;
    }

    .btn-submit {
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      background-color: #7A0000;
      color: #FFFFFF;
      font-size: 0.9rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-submit:hover {
      background-color: #5E0000;
    }

    /* Responsive Mobile Layout */
    @media (max-width: 768px) {
      body {
        flex-direction: column;
      }
      .left-panel {
        padding: 32px 20px;
      }
      .pup-logo {
        width: 120px;
        height: 120px;
        margin-bottom: 14px;
      }
      .brand-title {
        font-size: 1.6rem;
      }
      .campus-footer {
        margin-top: 16px;
      }
    }
  </style>
</head>
<body>

  <!-- Left Maroon Branding Section -->
  <div class="left-panel">
    <div class="brand-center">
      <img src="pupscout-logo.png" alt="PUPSCOUT Logo" class="pup-logo" />
      <h1 class="brand-title">PUPSCOUT</h1>
      <p class="brand-subtitle">PUP System for Campus Operations and Utility Tracker</p>
    </div>
    <p class="campus-footer">PUP A. Mabini Campus, Anonas Street, Sta. Mesa, Manila</p>
  </div>

  <!-- Right Form Section -->
  <div class="right-panel">
    <div class="login-card">
      <div class="auth-tabs">
        <a href="#" class="auth-tab active">Log In</a>
        <a href="/Identity/Account/Register" class="auth-tab">Create Account</a>
      </div>

      <h2 class="card-heading">Welcome back!</h2>

      <form method="post">
        <div class="form-group">
          <label class="form-label" for="webmail">PUP Webmail</label>
          <input type="email" id="webmail" name="Input.Email" class="form-control" placeholder="Enter your PUP webmail" required />
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="input-wrapper">
            <input type="password" id="password" name="Input.Password" class="form-control" placeholder="Enter your password" style="padding-right: 38px;" required />
            <button type="button" class="toggle-password" onclick="togglePass()" aria-label="Toggle password visibility">
              <svg id="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#666666" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Select Role</label>
          <input type="hidden" id="role-input" name="Input.Role" required />
          
          <div class="custom-select-wrapper" id="role-dropdown">
            <div class="custom-select-trigger" onclick="toggleDropdown()">
              <span id="role-selected-text">Select Role</span>
              <svg class="chevron-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#666666" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 12 15 18 9"></polyline>
              </svg>
            </div>
            <div class="custom-options">
              <div class="custom-option" onclick="selectRole('Student', this)">Student</div>
              <div class="custom-option" onclick="selectRole('Teacher', this)">Teacher</div>
              <div class="custom-option" onclick="selectRole('IT Equipment Personnel', this)">IT Equipment Personnel</div>
              <div class="custom-option" onclick="selectRole('Maintenance Personnel', this)">Maintenance Personnel</div>
              <div class="custom-option" onclick="selectRole('Administrator', this)">Administrator</div>
            </div>
          </div>
        </div>

        <button type="submit" class="btn-submit">Log In</button>
      </form>
    </div>
  </div>

  <script>
    function togglePass() {
      const passInput = document.getElementById('password');
      const eyeIcon = document.getElementById('eye-icon');
      
      if (passInput.type === 'password') {
        passInput.type = 'text';
        eyeIcon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>';
      } else {
        passInput.type = 'password';
        eyeIcon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';
      }
    }

    function toggleDropdown() {
      document.getElementById('role-dropdown').classList.toggle('open');
    }

    function selectRole(roleValue, element) {
      document.getElementById('role-input').value = roleValue;
      const textSpan = document.getElementById('role-selected-text');
      textSpan.textContent = roleValue;
      
      const trigger = document.querySelector('.custom-select-trigger');
      trigger.classList.add('has-value');

      document.querySelectorAll('.custom-option').forEach(opt => opt.classList.remove('selected'));
      element.classList.add('selected');

      document.getElementById('role-dropdown').classList.remove('open');
    }

    // Close dropdown when clicking outside
    document.addEventListener('click', function(e) {
      const dropdown = document.getElementById('role-dropdown');
      if (!dropdown.contains(e.target)) {
        dropdown.classList.remove('open');
      }
    });
  </script>
</body>
</html>
